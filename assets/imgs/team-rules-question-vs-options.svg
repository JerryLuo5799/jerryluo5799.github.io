<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">同一件事的两种问法</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">差别在于调研、比较、取舍这三步由谁来做。</text>

  <!-- left: open question -->
  <rect x="30" y="76" width="410" height="340" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="48" y="92" width="96" height="26" rx="13" fill="#dc2626"/>
  <text x="96" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">问答题</text>

  <rect x="48" y="134" width="300" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="62" y="152" font-size="11" fill="#94a3b8">小赵</text>
  <text x="62" y="168" font-size="12" fill="#475569">@老周 导出 Excel 用什么方案？</text>

  <text x="244" y="200" font-size="11" fill="#94a3b8" text-anchor="middle">—— 两小时后 ——</text>

  <rect x="232" y="212" width="190" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="246" y="230" font-size="11" fill="#94a3b8">老周</text>
  <text x="246" y="246" font-size="12" fill="#475569">你觉得呢？</text>

  <line x1="48" y1="276" x2="422" y2="276" stroke="#fca5a5" stroke-dasharray="4 4"/>
  <text x="48" y="302" font-size="12.5" font-weight="700" fill="#334155">留给老周的工作</text>
  <text x="48" y="326" font-size="12" fill="#475569">· 弄清数据量、格式要求、上线时间</text>
  <text x="48" y="348" font-size="12" fill="#475569">· 调研有哪些可行的做法</text>
  <text x="48" y="370" font-size="12" fill="#475569">· 比较并做出取舍</text>
  <text x="48" y="398" font-size="12" fill="#dc2626">耗时：两小时等待 + 至少一轮来回</text>

  <!-- right: options -->
  <rect x="460" y="76" width="410" height="340" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="478" y="92" width="96" height="26" rx="13" fill="#059669"/>
  <text x="526" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">选择题</text>

  <rect x="478" y="134" width="330" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="492" y="152" font-size="11" fill="#94a3b8">小赵</text>
  <text x="492" y="170" font-size="12" fill="#475569">A（推荐）后端生成，带格式，2 天</text>
  <text x="492" y="190" font-size="12" fill="#475569">B 前端导出，半天，不带格式</text>
  <text x="492" y="210" font-size="12" fill="#475569">C 接报表平台，排期两周以上</text>
  <text x="492" y="232" font-size="12" fill="#059669">推荐 A：财务要格式，月底要上线。请确认</text>

  <rect x="742" y="254" width="110" height="26" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="754" y="272" font-size="12" fill="#475569">老周：A，可以</text>

  <line x1="478" y1="290" x2="852" y2="290" stroke="#6ee7b7" stroke-dasharray="4 4"/>
  <text x="478" y="314" font-size="12.5" font-weight="700" fill="#334155">留给老周的工作</text>
  <text x="478" y="338" font-size="12" fill="#475569">· 判断推荐得对不对</text>
  <text x="478" y="360" font-size="12" fill="#475569">· 回一个字母</text>
  <text x="478" y="398" font-size="12" fill="#059669">耗时：十秒，决定权仍在老周手里</text>
</svg>
