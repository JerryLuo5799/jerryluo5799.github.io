<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ub" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">卡住之后的时间线：什么时候查，什么时候问</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">问得太早打断别人，问得太晚耽误自己。两条线把中间那段划出来。</text>

  <!-- axis -->
  <line x1="50" y1="150" x2="850" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#ub)"/>
  <text x="852" y="174" font-size="11.5" fill="#94a3b8" text-anchor="end">卡住的时长</text>

  <!-- zones -->
  <rect x="50" y="118" width="150" height="24" rx="4" fill="#fee2e2"/>
  <text x="125" y="135" font-size="12" fill="#b91c1c" text-anchor="middle">这时候问：太早</text>
  <rect x="204" y="118" width="330" height="24" rx="4" fill="#d1fae5"/>
  <text x="369" y="135" font-size="12" fill="#047857" text-anchor="middle">自己查、自己试，同时记下排除了什么</text>
  <rect x="538" y="118" width="304" height="24" rx="4" fill="#fee2e2"/>
  <text x="690" y="135" font-size="12" fill="#b91c1c" text-anchor="middle">还不问：太晚</text>

  <!-- ticks -->
  <circle cx="50" cy="150" r="6" fill="#64748b"/>
  <text x="50" y="100" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">遇到问题</text>

  <circle cx="202" cy="150" r="7" fill="#2563eb"/>
  <text x="202" y="100" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">2 分钟</text>

  <circle cx="536" cy="150" r="7" fill="#7c3aed"/>
  <text x="536" y="100" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">1 小时</text>

  <circle cx="760" cy="150" r="7" fill="#dc2626"/>
  <text x="760" y="100" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">第二天站会</text>

  <!-- cards -->
  <line x1="202" y1="158" x2="202" y2="196" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="50" y="196" width="260" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="66" y="222" font-size="12.5" font-weight="700" fill="#2563eb">2 分钟线：可以问了</text>
  <text x="66" y="246" font-size="12" fill="#475569">搜索、问 AI、翻项目文档都试过</text>
  <text x="66" y="268" font-size="12" fill="#475569">提问时写明：</text>
  <text x="66" y="288" font-size="11.5" fill="#64748b">· 现象是什么</text>
  <text x="66" y="306" font-size="11.5" fill="#64748b">· 查过什么、试过什么、结果如何</text>

  <line x1="536" y1="158" x2="536" y2="196" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="326" y="196" width="260" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="342" y="222" font-size="12.5" font-weight="700" fill="#7c3aed">1 小时线：必须问了</text>
  <text x="342" y="246" font-size="12" fill="#475569">判断标准：这一小时里，对问题的</text>
  <text x="342" y="266" font-size="12" fill="#475569">理解有没有比之前更深</text>
  <text x="342" y="288" font-size="11.5" fill="#64748b">没有 → 找人一起看</text>
  <text x="342" y="306" font-size="11.5" fill="#64748b">两人一两小时，好过一人两天</text>

  <line x1="760" y1="158" x2="760" y2="196" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="602" y="196" width="268" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="618" y="222" font-size="12.5" font-weight="700" fill="#dc2626">站会：最后一道保险</text>
  <text x="618" y="246" font-size="12" fill="#475569">不说"还在查"，要说：</text>
  <text x="618" y="268" font-size="11.5" fill="#64748b">· 卡了多久，已排除什么</text>
  <text x="618" y="288" font-size="11.5" fill="#64748b">· 需要谁、大概多长时间</text>
  <text x="618" y="306" font-size="11.5" fill="#64748b">连续两天同一句话，负责人主动问</text>

  <text x="30" y="362" font-size="12" fill="#475569">不属于"卡住"的两种情况另有办法：结果不确定的探索，事先定时间上限；等别人拍板，按留言、电话、</text>
  <text x="30" y="382" font-size="12" fill="#475569">找替代的人、事后告知四步走。</text>
</svg>
