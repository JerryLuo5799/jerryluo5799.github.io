<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="tf" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">一次 agent 会话的 token 花在哪，三件套各管哪一段</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">每一轮请求都会把前面所有内容重新发一遍，所以早进入上下文的东西，会在后面每一轮里被反复计费。</text>

  <!-- loop band -->
  <rect x="30" y="72" width="840" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="94" font-size="12.5" fill="#475569" text-anchor="middle">第 1 轮请求 → 调工具 → 结果追加进上下文 → 第 2 轮请求（带着前面全部） → … → 最终回答</text>

  <!-- column 1 -->
  <rect x="30" y="122" width="200" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="148" font-size="14" font-weight="700" fill="#334155">① 常驻上下文</text>
  <text x="46" y="172" font-size="12" fill="#475569">系统提示、CLAUDE.md、</text>
  <text x="46" y="190" font-size="12" fill="#475569">工具定义、技能清单</text>
  <text x="46" y="214" font-size="12" fill="#64748b">每轮都带着，靠缓存</text>
  <text x="46" y="232" font-size="12" fill="#64748b">降价但不会消失</text>

  <!-- column 2 -->
  <rect x="243" y="122" width="200" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="259" y="148" font-size="14" font-weight="700" fill="#334155">② 探索代码</text>
  <text x="259" y="172" font-size="12" fill="#475569">Glob / Grep / Read</text>
  <text x="259" y="190" font-size="12" fill="#475569">一个文件一个文件地翻</text>
  <text x="259" y="214" font-size="12" fill="#64748b">轮数多，读进来的整文件</text>
  <text x="259" y="232" font-size="12" fill="#64748b">会一直留在上下文里</text>

  <!-- column 3 -->
  <rect x="456" y="122" width="200" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="472" y="148" font-size="14" font-weight="700" fill="#334155">③ 命令输出</text>
  <text x="472" y="172" font-size="12" fill="#475569">dotnet build / test、</text>
  <text x="472" y="190" font-size="12" fill="#475569">git log、find、ls</text>
  <text x="472" y="214" font-size="12" fill="#64748b">大部分行是"成功了"，</text>
  <text x="472" y="232" font-size="12" fill="#64748b">真正有用的只有几行</text>

  <!-- column 4 -->
  <rect x="669" y="122" width="200" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="148" font-size="14" font-weight="700" fill="#334155">④ 模型输出</text>
  <text x="685" y="172" font-size="12" fill="#475569">过程说明、解释、总结</text>
  <text x="685" y="190" font-size="12" fill="#475569">"好的，我来看一下……"</text>
  <text x="685" y="214" font-size="12" fill="#64748b">单价是输入的 5 倍，</text>
  <text x="685" y="232" font-size="12" fill="#64748b">也会进入下一轮的输入</text>

  <!-- arrows -->
  <line x1="130" y1="258" x2="130" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#tf)"/>
  <line x1="343" y1="258" x2="343" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#tf)"/>
  <line x1="556" y1="258" x2="556" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#tf)"/>
  <line x1="769" y1="258" x2="769" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#tf)"/>

  <!-- tool boxes -->
  <rect x="30" y="296" width="200" height="98" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="322" font-size="14" font-weight="700" fill="#dc2626">没人管，反而变大</text>
  <text x="46" y="346" font-size="12" fill="#475569">规则、技能、MCP 工具定义</text>
  <text x="46" y="364" font-size="12" fill="#475569">都要占位：三件套全开</text>
  <text x="46" y="382" font-size="12" fill="#475569">实测多出约 3.9k token</text>

  <rect x="243" y="296" width="200" height="98" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="259" y="322" font-size="14" font-weight="700" fill="#7c3aed">CodeGraph</text>
  <text x="259" y="346" font-size="12" fill="#475569">预建代码图 + MCP 工具</text>
  <text x="259" y="364" font-size="12" fill="#475569">一次调用拿到相关源码</text>
  <text x="259" y="382" font-size="12" fill="#475569">和调用路径</text>

  <rect x="456" y="296" width="200" height="98" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="472" y="322" font-size="14" font-weight="700" fill="#2563eb">rtk</text>
  <text x="472" y="346" font-size="12" fill="#475569">PreToolUse hook 把命令</text>
  <text x="472" y="364" font-size="12" fill="#475569">改写成 rtk …，只把</text>
  <text x="472" y="382" font-size="12" fill="#475569">摘要和失败交给模型</text>

  <rect x="669" y="296" width="200" height="98" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="685" y="322" font-size="14" font-weight="700" fill="#059669">Caveman</text>
  <text x="685" y="346" font-size="12" fill="#475569">SessionStart hook 注入</text>
  <text x="685" y="364" font-size="12" fill="#475569">"少说话"规则，砍掉客套</text>
  <text x="685" y="382" font-size="12" fill="#475569">和复述，代码原样保留</text>

  <!-- overlap note -->
  <rect x="30" y="410" width="840" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="46" y="437" font-size="12" fill="#475569">重叠：Caveman 的 CLI 也能压缩命令输出，与 rtk 二选一即可；CodeGraph 一次返回的内容多，留在上下文里的反而更多。</text>
</svg>
