<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="axz" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">什么时候值得自动化：先看频率和确定性，再挑手段</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">把低频又需要判断的活做成全自动工作流，是最常见的一种浪费。</text>

  <line x1="150" y1="414" x2="830" y2="414" stroke="#94a3b8" stroke-width="2" marker-end="url(#axz)"/>
  <line x1="150" y1="414" x2="150" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#axz)"/>
  <text x="790" y="440" font-size="12" font-weight="700" fill="#64748b">确定性</text>
  <text x="440" y="440" font-size="11.5" fill="#94a3b8">每次做法都一样、不需要临场判断 →</text>
  <text x="60" y="100" font-size="12" font-weight="700" fill="#64748b">频率</text>
  <text x="52" y="250" font-size="11.5" fill="#94a3b8" transform="rotate(-90 52 250)" text-anchor="middle">一周发生几次 ↑</text>

  <g>
    <rect x="164" y="240" width="322" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="184" y="260" width="130" height="26" rx="13" fill="#94a3b8"/>
    <text x="249" y="278" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">临时对话就够</text>
    <text x="184" y="310" font-size="12.5" fill="#475569">低频 + 需要判断</text>
    <text x="184" y="334" font-size="11.5" fill="#64748b">一次性的架构调研、疑难 bug 定位、</text>
    <text x="184" y="354" font-size="11.5" fill="#64748b">半年一次的框架升级评估</text>
    <text x="184" y="382" font-size="11.5" fill="#dc2626">给它建工作流是纯浪费</text>
  </g>

  <g>
    <rect x="500" y="240" width="322" height="160" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="520" y="260" width="150" height="26" rx="13" fill="#64748b"/>
    <text x="595" y="278" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt 文件 / Skill</text>
    <text x="520" y="310" font-size="12.5" fill="#475569">低频 + 确定</text>
    <text x="520" y="334" font-size="11.5" fill="#64748b">数据库迁移、发版检查单、</text>
    <text x="520" y="354" font-size="11.5" fill="#64748b">新增报销类别</text>
    <text x="520" y="382" font-size="11.5" fill="#64748b">存下来，用到时手动触发</text>
  </g>

  <g>
    <rect x="164" y="72" width="322" height="160" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="184" y="92" width="130" height="26" rx="13" fill="#7c3aed"/>
    <text x="249" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">专职 Agent</text>
    <text x="184" y="142" font-size="12.5" fill="#475569">高频 + 需要判断</text>
    <text x="184" y="166" font-size="11.5" fill="#64748b">代码评审、PR 分诊、</text>
    <text x="184" y="186" font-size="11.5" fill="#64748b">把需求拆成可执行的任务</text>
    <text x="184" y="214" font-size="11.5" fill="#7c3aed">配好角色与工具集，人来召唤</text>
  </g>

  <g>
    <rect x="500" y="72" width="322" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="520" y="92" width="150" height="26" rx="13" fill="#059669"/>
    <text x="595" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Agentic Workflow</text>
    <text x="520" y="142" font-size="12.5" fill="#475569">高频 + 确定</text>
    <text x="520" y="166" font-size="11.5" fill="#64748b">每日超期单据巡检、依赖升级、</text>
    <text x="520" y="186" font-size="11.5" fill="#64748b">Issue 自动打标与分类</text>
    <text x="520" y="214" font-size="11.5" fill="#059669">事件触发，人只看结果</text>
  </g>
</svg>
