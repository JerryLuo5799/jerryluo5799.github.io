<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">一段文本是怎么被脱敏的：四个识别器同时上，谁的分数高听谁的</text>

  <!-- input -->
  <rect x="25" y="58" width="850" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="45" y="78" font-size="12" font-weight="700" fill="#64748b">原文</text>
  <text x="45" y="96" font-size="13" fill="#334155">张伟的手机是 13800138000，邮箱 zhang@example.com，身份证 11010519491231002X</text>

  <!-- nlp engine -->
  <rect x="25" y="122" width="850" height="42" rx="8" fill="#1e293b"/>
  <text x="45" y="148" font-size="13" font-weight="700" fill="#ffffff">① NLP 引擎（默认 spaCy）：分词、词性、命名实体识别</text>
  <text x="860" y="148" font-size="11.5" fill="#94a3b8" text-anchor="end">这一层决定了它「懂不懂」这门语言</text>
  <line x1="450" y1="104" x2="450" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="450" y1="164" x2="450" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#pa)"/>

  <!-- recognizers -->
  <rect x="25" y="184" width="850" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="45" y="206" font-size="13" font-weight="700" fill="#334155">② 识别器集合（Recognizers）—— 全部并行跑一遍</text>

  <rect x="45" y="218" width="192" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="141" y="240" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">正则表达式</text>
  <text x="141" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">手机号、邮箱、IP</text>
  <text x="141" y="278" font-size="11.5" fill="#94a3b8" text-anchor="middle">快，但容易误报</text>

  <rect x="253" y="218" width="192" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="349" y="240" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">校验位算法</text>
  <text x="349" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">银行卡、身份证</text>
  <text x="349" y="278" font-size="11.5" fill="#94a3b8" text-anchor="middle">能算出真假，最准</text>

  <rect x="461" y="218" width="192" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="557" y="240" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">词表 Deny-list</text>
  <text x="557" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">固定词：职务、科室</text>
  <text x="557" y="278" font-size="11.5" fill="#94a3b8" text-anchor="middle">简单粗暴，可控</text>

  <rect x="669" y="218" width="186" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="762" y="240" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">NER 模型</text>
  <text x="762" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">人名、地名、机构</text>
  <text x="762" y="278" font-size="11.5" fill="#94a3b8" text-anchor="middle">写不出规则的靠它</text>

  <line x1="450" y1="302" x2="450" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#pa)"/>

  <!-- results -->
  <rect x="25" y="322" width="850" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="45" y="343" font-size="13" font-weight="700" fill="#334155">③ 每个命中都带一个 0–1 的置信度分数</text>
  <text x="45" y="368" font-size="12" fill="#475569">PHONE_NUMBER [6,17] 0.85　　EMAIL_ADDRESS [21,40] 1.00　　PERSON [0,2] 0.85　　DATE_TIME [50,58] 0.60</text>
  <rect x="700" y="330" width="160" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="780" y="350" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">score_threshold 卡掉低分</text>

  <line x1="450" y1="384" x2="450" y2="402" stroke="#475569" stroke-width="2" marker-end="url(#pa)"/>

  <!-- anonymize -->
  <rect x="25" y="404" width="850" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="45" y="424" font-size="12" font-weight="700" fill="#047857">④ Anonymizer 按实体类型分别处理</text>
  <text x="45" y="444" font-size="13" fill="#334155">&lt;PERSON&gt;的手机是 138****0000，邮箱 &lt;EMAIL_ADDRESS&gt;，身份证 &lt;ID_CARD&gt;</text>
</svg>
