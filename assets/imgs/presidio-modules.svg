<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Presidio 的四个模块：各管一种数据形态</text>
  <text x="450" y="56" font-size="12.5" fill="#64748b" text-anchor="middle">它们是四个独立的 Python 包，可以只装你需要的那个</text>

  <!-- analyzer -->
  <rect x="25" y="78" width="200" height="252" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="25" y="78" width="200" height="46" rx="12" fill="#ddd6fe"/>
  <rect x="25" y="112" width="200" height="12" fill="#ddd6fe"/>
  <text x="125" y="107" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">presidio-analyzer</text>
  <text x="125" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">找出 PII</text>
  <text x="45" y="180" font-size="12" fill="#475569">输入：一段文本</text>
  <text x="45" y="204" font-size="12" fill="#475569">输出：实体类型 + 位置</text>
  <text x="45" y="224" font-size="12" fill="#475569">　　　+ 置信度分数</text>
  <rect x="45" y="244" width="160" height="66" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="57" y="266" font-size="11.5" fill="#64748b">「我的手机 13800138000」</text>
  <text x="57" y="286" font-size="11.5" fill="#5b21b6">→ PHONE_NUMBER</text>
  <text x="57" y="303" font-size="11.5" fill="#5b21b6">　 [5,16] score=0.85</text>

  <!-- anonymizer -->
  <rect x="245" y="78" width="200" height="252" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="245" y="78" width="200" height="46" rx="12" fill="#a7f3d0"/>
  <rect x="245" y="112" width="200" height="12" fill="#a7f3d0"/>
  <text x="345" y="107" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">presidio-anonymizer</text>
  <text x="345" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">处理 PII</text>
  <text x="265" y="180" font-size="12" fill="#475569">输入：原文 + 识别结果</text>
  <text x="265" y="204" font-size="12" fill="#475569">输出：脱敏后的文本</text>
  <rect x="265" y="224" width="160" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="277" y="245" font-size="11.5" font-weight="700" fill="#065f46">7 种处理方式：</text>
  <text x="277" y="265" font-size="11.5" fill="#64748b">replace / redact / mask</text>
  <text x="277" y="283" font-size="11.5" fill="#64748b">hash / encrypt / keep</text>
  <text x="277" y="301" font-size="11.5" fill="#64748b">custom（自定义）</text>

  <!-- image redactor -->
  <rect x="465" y="78" width="200" height="252" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="465" y="78" width="200" height="46" rx="12" fill="#bfdbfe"/>
  <rect x="465" y="112" width="200" height="12" fill="#bfdbfe"/>
  <text x="565" y="107" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">presidio-image-redactor</text>
  <text x="565" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">图片涂黑</text>
  <text x="485" y="180" font-size="12" fill="#475569">输入：图片 / DICOM</text>
  <text x="485" y="204" font-size="12" fill="#475569">输出：涂黑后的图片</text>
  <rect x="485" y="224" width="160" height="86" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="497" y="245" font-size="11.5" font-weight="700" fill="#1e40af">工作方式：</text>
  <text x="497" y="265" font-size="11.5" fill="#64748b">先 OCR 认出图里的字</text>
  <text x="497" y="283" font-size="11.5" fill="#64748b">再交给 analyzer 判断</text>
  <text x="497" y="301" font-size="11.5" fill="#64748b">最后画黑框盖住</text>

  <!-- structured -->
  <rect x="685" y="78" width="190" height="252" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="685" y="78" width="190" height="46" rx="12" fill="#fde68a"/>
  <rect x="685" y="112" width="190" height="12" fill="#fde68a"/>
  <text x="780" y="107" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">presidio-structured</text>
  <text x="780" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">批量处理</text>
  <text x="705" y="180" font-size="12" fill="#475569">输入：表格 / JSON</text>
  <text x="705" y="204" font-size="12" fill="#475569">输出：整列脱敏后的数据</text>
  <rect x="705" y="224" width="150" height="86" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="717" y="245" font-size="11.5" font-weight="700" fill="#92400e">适合：</text>
  <text x="717" y="265" font-size="11.5" fill="#64748b">数据库导出的 CSV</text>
  <text x="717" y="283" font-size="11.5" fill="#64748b">给测试环境造数据</text>
  <text x="717" y="301" font-size="11.5" fill="#64748b">整列一次性处理</text>

  <!-- bracket -->
  <path d="M 35 348 L 35 358 L 435 358 L 435 348" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <line x1="235" y1="358" x2="235" y2="368" stroke="#7c3aed" stroke-width="2"/>
  <text x="235" y="390" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">文本脱敏的主力组合：先 analyzer 找，再 anonymizer 改</text>
  <text x="235" y="412" font-size="12" fill="#64748b" text-anchor="middle">绝大多数人只用这两个，右边两个按需选装</text>
</svg>
