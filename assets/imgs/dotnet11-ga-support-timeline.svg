<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">.NET 8 – 11 的支持周期</text>
  <text x="450" y="56" font-size="12.5" fill="#64748b" text-anchor="middle">2026-11-10 这一天：.NET 11 发布，.NET 8 与 .NET 9 同时停止支持；.NET 10 与 .NET 11 在同一天结束支持</text>

  <!-- 年份刻度 -->
  <g font-size="11.5" fill="#94a3b8" text-anchor="middle">
    <line x1="204" y1="84" x2="204" y2="300" stroke="#f1f5f9"/>
    <line x1="331" y1="84" x2="331" y2="300" stroke="#f1f5f9"/>
    <line x1="458" y1="84" x2="458" y2="300" stroke="#f1f5f9"/>
    <line x1="585" y1="84" x2="585" y2="300" stroke="#f1f5f9"/>
    <line x1="712" y1="84" x2="712" y2="300" stroke="#f1f5f9"/>
    <line x1="839" y1="84" x2="839" y2="300" stroke="#f1f5f9"/>
    <text x="204" y="318">2024</text>
    <text x="331" y="318">2025</text>
    <text x="458" y="318">2026</text>
    <text x="585" y="318">2027</text>
    <text x="712" y="318">2028</text>
    <text x="839" y="318">2029</text>
  </g>

  <!-- .NET 8 -->
  <text x="24" y="114" font-size="13" font-weight="700" fill="#64748b">.NET 8</text>
  <text x="24" y="131" font-size="11" fill="#94a3b8">LTS · 已停止支持</text>
  <rect x="187" y="100" width="380" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="197" y="120" font-size="11.5" fill="#64748b">2023-11-14</text>
  <text x="557" y="120" font-size="11.5" fill="#64748b" text-anchor="end">2026-11-10</text>

  <!-- .NET 9 -->
  <text x="24" y="164" font-size="13" font-weight="700" fill="#64748b">.NET 9</text>
  <text x="24" y="181" font-size="11" fill="#94a3b8">STS · 已停止支持</text>
  <rect x="314" y="150" width="253" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="324" y="170" font-size="11.5" fill="#64748b">2024-11-12</text>
  <text x="557" y="170" font-size="11.5" fill="#64748b" text-anchor="end">2026-11-10</text>

  <!-- .NET 10 -->
  <text x="24" y="214" font-size="13" font-weight="700" fill="#1e40af">.NET 10</text>
  <text x="24" y="231" font-size="11" fill="#2563eb">LTS · 三年</text>
  <rect x="440" y="200" width="382" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="220" font-size="11.5" fill="#1e40af">2025-11-11</text>
  <text x="812" y="220" font-size="11.5" fill="#1e40af" text-anchor="end">2028-11-14</text>

  <!-- .NET 11 -->
  <text x="24" y="264" font-size="13" font-weight="700" fill="#5b21b6">.NET 11</text>
  <text x="24" y="281" font-size="11" fill="#7c3aed">STS · 两年</text>
  <rect x="567" y="250" width="255" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="577" y="270" font-size="11.5" fill="#5b21b6">2026-11-10</text>
  <text x="812" y="270" font-size="11.5" fill="#5b21b6" text-anchor="end">2028-11-14</text>

  <!-- 当前 -->
  <line x1="567" y1="84" x2="567" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="567" y="78" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">GA</text>
  <!-- 共同终点 -->
  <line x1="822" y1="190" x2="822" y2="292" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="822" y="342" font-size="12" fill="#047857" text-anchor="middle">同一天结束支持</text>
  <line x1="822" y1="328" x2="822" y2="300" stroke="#059669" stroke-width="1"/>
</svg>
