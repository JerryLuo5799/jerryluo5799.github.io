<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">AI 辅助开发的六个环节：任何一环塌了，上面的都白搭</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">从下往上读。大多数人只在「执行层」使劲，却栽在没打好的「地基层」上。</text>

  <!-- 收口层 -->
  <g>
    <rect x="30" y="76" width="840" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="46" y="92" width="86" height="26" rx="13" fill="#059669"/>
    <text x="89" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">收口层</text>
    <text x="46" y="140" font-size="11.5" fill="#64748b">决定产出</text>
    <text x="46" y="158" font-size="11.5" fill="#64748b">能不能进主干</text>

    <rect x="150" y="92" width="250" height="80" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="166" y="116" font-size="13.5" font-weight="700" fill="#334155">⑤ 验证闸门</text>
    <text x="166" y="138" font-size="11.5" fill="#64748b">自动 code review、端到端测试</text>
    <text x="166" y="156" font-size="11.5" fill="#64748b">预发布验证、变更归属</text>

    <rect x="414" y="92" width="250" height="80" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="430" y="116" font-size="13.5" font-weight="700" fill="#334155">⑥ 团队规模化</text>
    <text x="430" y="138" font-size="11.5" fill="#64748b">工作流集中化、成本可见</text>
    <text x="430" y="156" font-size="11.5" fill="#64748b">让一个人的经验变成全队的</text>

    <text x="684" y="116" font-size="11.5" font-weight="700" fill="#059669">塌了会怎样</text>
    <text x="684" y="138" font-size="11.5" fill="#475569">AI 写得飞快，但没人</text>
    <text x="684" y="156" font-size="11.5" fill="#475569">敢合并；返工比手写还多</text>
  </g>

  <!-- 执行层 -->
  <g>
    <rect x="30" y="196" width="840" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="46" y="212" width="86" height="26" rx="13" fill="#2563eb"/>
    <text x="89" y="230" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">执行层</text>
    <text x="46" y="260" font-size="11.5" fill="#64748b">决定一次任务</text>
    <text x="46" y="278" font-size="11.5" fill="#64748b">跑得顺不顺</text>

    <rect x="150" y="212" width="250" height="80" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="166" y="236" font-size="13.5" font-weight="700" fill="#334155">③ 协作节奏与护栏</text>
    <text x="166" y="258" font-size="11.5" fill="#64748b">先出计划再动手、小步提交</text>
    <text x="166" y="276" font-size="11.5" fill="#64748b">跑偏时能把它拉回来</text>

    <rect x="414" y="212" width="250" height="80" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="430" y="236" font-size="13.5" font-weight="700" fill="#334155">④ 能力扩展</text>
    <text x="430" y="258" font-size="11.5" fill="#64748b">Chat Mode / MCP / Skill</text>
    <text x="430" y="276" font-size="11.5" fill="#64748b">自定义 Agent、工作流编排</text>

    <text x="684" y="236" font-size="11.5" font-weight="700" fill="#2563eb">塌了会怎样</text>
    <text x="684" y="258" font-size="11.5" fill="#475569">一次改 20 个文件，</text>
    <text x="684" y="276" font-size="11.5" fill="#475569">出错只能整段回滚重来</text>
  </g>

  <!-- 地基层 -->
  <g>
    <rect x="30" y="316" width="840" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="46" y="332" width="86" height="26" rx="13" fill="#7c3aed"/>
    <text x="89" y="350" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">地基层</text>
    <text x="46" y="380" font-size="11.5" fill="#64748b">决定 AI 看得见</text>
    <text x="46" y="398" font-size="11.5" fill="#64748b">什么、动得了什么</text>

    <rect x="150" y="332" width="250" height="80" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="166" y="356" font-size="13.5" font-weight="700" fill="#334155">① 环境与工具</text>
    <text x="166" y="378" font-size="11.5" fill="#64748b">CLI 还是 IDE、隔离与并行</text>
    <text x="166" y="396" font-size="11.5" fill="#64748b">本地模型、成本可见</text>

    <rect x="414" y="332" width="250" height="80" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="430" y="356" font-size="13.5" font-weight="700" fill="#334155">② 上下文与记忆</text>
    <text x="430" y="378" font-size="11.5" fill="#64748b">AGENTS.md、分作用域规则</text>
    <text x="430" y="396" font-size="11.5" fill="#64748b">任务摘要、设计决策留档</text>

    <text x="684" y="356" font-size="11.5" font-weight="700" fill="#7c3aed">塌了会怎样</text>
    <text x="684" y="378" font-size="11.5" fill="#475569">每次都要重讲一遍项目，</text>
    <text x="684" y="396" font-size="11.5" fill="#475569">写出来的代码不像自家的</text>
  </g>

  <text x="30" y="452" font-size="11.5" fill="#94a3b8">诊断顺序：先看地基层是否成立，再看执行层；收口层的问题，十有八九是前两层的账。</text>
</svg>
