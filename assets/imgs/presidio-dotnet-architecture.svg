<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <defs>
    <marker id="da" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="db" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">.NET 怎么用一个 Python 项目：把它当成两个 HTTP 服务</text>
  <text x="450" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">一次脱敏 = 两次调用，先问「哪里有 PII」，再让它「改掉」</text>

  <!-- .NET side -->
  <rect x="25" y="82" width="250" height="300" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="110" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">你的 ASP.NET Core 应用</text>
  <rect x="45" y="128" width="210" height="54" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="150" y="150" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">IPiiScrubber</text>
  <text x="150" y="169" font-size="11.5" fill="#64748b" text-anchor="middle">你封装的脱敏服务</text>
  <rect x="45" y="196" width="210" height="54" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="150" y="218" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">IHttpClientFactory</text>
  <text x="150" y="237" font-size="11.5" fill="#64748b" text-anchor="middle">别 new HttpClient</text>
  <rect x="45" y="264" width="210" height="98" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="150" y="286" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">典型用途</text>
  <text x="62" y="308" font-size="11.5" fill="#64748b">· 日志写盘前脱敏</text>
  <text x="62" y="328" font-size="11.5" fill="#64748b">· 接口响应脱敏</text>
  <text x="62" y="348" font-size="11.5" fill="#64748b">· 导出数据前脱敏</text>

  <!-- docker side -->
  <rect x="360" y="82" width="515" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="384" y="108" font-size="13.5" font-weight="700" fill="#475569">Docker Compose 网络</text>
  <text x="384" y="128" font-size="11.5" fill="#94a3b8">ghcr.io/data-privacy-stack/presidio-*</text>

  <rect x="384" y="144" width="230" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="499" y="168" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">presidio-analyzer</text>
  <text x="499" y="189" font-size="12" fill="#334155" text-anchor="middle">POST /analyze</text>
  <text x="499" y="209" font-size="11.5" fill="#64748b" text-anchor="middle">宿主 5002 → 容器 3000</text>
  <text x="499" y="231" font-size="11.5" fill="#94a3b8" text-anchor="middle">首次启动要加载 NLP 模型，慢</text>

  <rect x="632" y="144" width="225" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="744" y="168" font-size="13.5" font-weight="700" fill="#047857" text-anchor="middle">presidio-anonymizer</text>
  <text x="744" y="189" font-size="12" fill="#334155" text-anchor="middle">POST /anonymize</text>
  <text x="744" y="209" font-size="11.5" fill="#64748b" text-anchor="middle">宿主 5001 → 容器 3000</text>
  <text x="744" y="231" font-size="11.5" fill="#94a3b8" text-anchor="middle">纯字符串操作，很快</text>

  <!-- call 1 -->
  <path d="M 275 176 L 380 176" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#da)"/>
  <text x="328" y="168" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">①</text>

  <!-- result back -->
  <path d="M 384 262 L 300 262 L 300 200 L 275 200" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#da)"/>
  <text x="470" y="278" font-size="11.5" fill="#1d4ed8">② 返回实体列表：类型 + 起止位置 + 分数</text>

  <!-- call 2 -->
  <path d="M 275 320 L 330 320 L 330 300 L 700 300 L 700 252" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#db)"/>
  <text x="500" y="318" font-size="11.5" font-weight="700" fill="#047857">③ 把「原文 + 上一步的实体列表 + 处理规则」一起发过去</text>

  <rect x="384" y="330" width="473" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="620" y="355" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">注意：这两个容器不带任何鉴权，只能挂在内网，绝不能直接暴露到公网</text>

  <text x="450" y="410" font-size="12.5" fill="#64748b" text-anchor="middle">为什么不用 Python.NET 或起子进程？REST 方式部署、扩容、升级都独立，出问题也不会把你的进程拖垮。</text>
</svg>
