<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="pp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">一个承诺的三条路径</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">三条路都算守信。失信的是第四条：到点了，什么都没说。</text>

  <g>
    <rect x="30" y="170" width="190" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="46" y="184" width="72" height="24" rx="12" fill="#64748b"/>
    <text x="82" y="201" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">做出承诺</text>
    <text x="46" y="232" font-size="12" fill="#475569">交付什么 + 什么时候</text>
    <text x="46" y="254" font-size="12" fill="#64748b">"导出接口周三给"</text>
    <text x="46" y="272" font-size="11" fill="#94a3b8">同时写进日历或待办</text>
  </g>

  <path d="M222,205 L270,205 L270,115 L316,115" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>
  <line x1="222" y1="225" x2="316" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>
  <path d="M222,245 L270,245 L270,335 L316,335" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>

  <g>
    <rect x="320" y="72" width="250" height="86" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="336" y="86" width="84" height="24" rx="12" fill="#059669"/>
    <text x="378" y="103" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">① 做到了</text>
    <text x="336" y="132" font-size="12" fill="#475569">按时交付，交的是完整的东西</text>
    <text x="336" y="150" font-size="11" fill="#64748b">顺带说一句"已提交，可以验收了"</text>
  </g>
  <g>
    <rect x="320" y="182" width="250" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="336" y="196" width="126" height="24" rx="12" fill="#2563eb"/>
    <text x="399" y="213" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">② 做不到，提前说</text>
    <text x="336" y="242" font-size="12" fill="#475569">一发现赶不上就说，不等到截止时间</text>
    <text x="336" y="260" font-size="11" fill="#64748b">原因 + 新时间，或缩小范围先交一版</text>
  </g>
  <g>
    <rect x="320" y="292" width="250" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="336" y="306" width="126" height="24" rx="12" fill="#7c3aed"/>
    <text x="399" y="323" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">③ 已失信，认账</text>
    <text x="336" y="352" font-size="12" fill="#475569">承认没做到，不找一串理由</text>
    <text x="336" y="370" font-size="11" fill="#64748b">说明下次怎么避免，然后真的照做</text>
  </g>

  <line x1="572" y1="115" x2="626" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>
  <line x1="572" y1="225" x2="626" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>
  <line x1="572" y1="335" x2="626" y2="335" stroke="#94a3b8" stroke-width="2" marker-end="url(#pp)"/>

  <g font-size="12">
    <rect x="630" y="72" width="240" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="646" y="98" font-weight="700" fill="#334155">对方得到的</text>
    <text x="646" y="122" fill="#475569">按原计划推进</text>
    <text x="646" y="144" fill="#059669">下次不需要盯你</text>

    <rect x="630" y="182" width="240" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="646" y="208" font-weight="700" fill="#334155">对方得到的</text>
    <text x="646" y="232" fill="#475569">有时间调整自己的安排</text>
    <text x="646" y="254" fill="#2563eb">损失的只是一点预期</text>

    <rect x="630" y="292" width="240" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="646" y="318" font-weight="700" fill="#334155">对方得到的</text>
    <text x="646" y="342" fill="#475569">安排已被打乱，但知道原因</text>
    <text x="646" y="364" fill="#7c3aed">信任受损，尚可修复</text>
  </g>

  <text x="30" y="404" font-size="12" fill="#dc2626">第四条路：到点没交、也没说。对方的安排被打乱，并且从此每个时间点都要自己来问。</text>
</svg>
