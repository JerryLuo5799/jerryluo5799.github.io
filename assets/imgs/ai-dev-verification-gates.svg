<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">四道闸门：越靠前的越便宜，人类只该看前三道拦不住的东西</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">如果你的 review 时间花在「这里少了个 await」上，说明前面三道门没架好。</text>

  <rect x="26" y="88" width="104" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="78" y="128" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">agent</text>
  <text x="78" y="150" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">的产出</text>
  <text x="78" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">draft PR</text>

  <path d="M 132 140 L 156 140" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 322 140 L 346 140" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 512 140 L 536 140" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 702 140 L 726 140" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>

  <g>
    <rect x="160" y="88" width="160" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="176" y="102" width="26" height="24" rx="6" fill="#059669"/>
    <text x="189" y="119" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="212" y="119" font-size="13" font-weight="700" fill="#334155">机器闸</text>
    <text x="176" y="146" font-size="11.5" fill="#475569">编译 · 测试 · 约定测试</text>
    <text x="176" y="166" font-size="11.5" fill="#475569">AI 自动评审</text>
    <text x="176" y="184" font-size="11" fill="#059669">秒级 · 零人力</text>
  </g>

  <g>
    <rect x="350" y="88" width="160" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="366" y="102" width="26" height="24" rx="6" fill="#2563eb"/>
    <text x="379" y="119" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="402" y="119" font-size="13" font-weight="700" fill="#334155">行为闸</text>
    <text x="366" y="146" font-size="11.5" fill="#475569">Playwright 跑真浏览器</text>
    <text x="366" y="166" font-size="11.5" fill="#475569">agent 自己看结果</text>
    <text x="366" y="184" font-size="11" fill="#2563eb">分钟级 · 零人力</text>
  </g>

  <g>
    <rect x="540" y="88" width="160" height="104" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <rect x="556" y="102" width="26" height="24" rx="6" fill="#ca8a04"/>
    <text x="569" y="119" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="592" y="119" font-size="13" font-weight="700" fill="#334155">环境闸</text>
    <text x="556" y="146" font-size="11.5" fill="#475569">每个 PR 一个预览环境</text>
    <text x="556" y="166" font-size="11.5" fill="#475569">用真数据形态点一遍</text>
    <text x="556" y="184" font-size="11" fill="#ca8a04">分钟级 · 几分钟人力</text>
  </g>

  <g>
    <rect x="730" y="88" width="140" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="746" y="102" width="26" height="24" rx="6" fill="#7c3aed"/>
    <text x="759" y="119" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="782" y="119" font-size="13" font-weight="700" fill="#334155">人类闸</text>
    <text x="746" y="146" font-size="11.5" fill="#475569">意图对不对</text>
    <text x="746" y="166" font-size="11.5" fill="#475569">该做的做了没</text>
    <text x="746" y="184" font-size="11" fill="#7c3aed">最贵的资源</text>
  </g>

  <text x="30" y="228" font-size="12.5" font-weight="700" fill="#94a3b8">各自拦住的典型问题</text>
  <line x1="30" y1="236" x2="870" y2="236" stroke="#e2e8f0" stroke-width="2"/>

  <text x="160" y="260" font-size="11.5" fill="#475569">金额用了 double</text>
  <text x="160" y="280" font-size="11.5" fill="#475569">阈值写在端点里</text>
  <text x="160" y="300" font-size="11.5" fill="#475569">测试被标了 Skip</text>
  <text x="160" y="320" font-size="11.5" fill="#475569">少了 await</text>

  <text x="350" y="260" font-size="11.5" fill="#475569">按钮点了没反应</text>
  <text x="350" y="280" font-size="11.5" fill="#475569">表单能重复提交</text>
  <text x="350" y="300" font-size="11.5" fill="#475569">金额显示成 880.00000001</text>
  <text x="350" y="320" font-size="11.5" fill="#475569">报错弹窗是英文的</text>

  <text x="540" y="260" font-size="11.5" fill="#475569">迁移在真库上跑不过</text>
  <text x="540" y="280" font-size="11.5" fill="#475569">配置项忘了加</text>
  <text x="540" y="300" font-size="11.5" fill="#475569">一万条数据时页面卡死</text>
  <text x="540" y="320" font-size="11.5" fill="#475569">和别的 PR 冲突</text>

  <text x="730" y="260" font-size="11.5" fill="#475569">做的不是我要的</text>
  <text x="730" y="280" font-size="11.5" fill="#475569">顺手改了不该改的</text>
  <text x="730" y="300" font-size="11.5" fill="#475569">绕过了业务约束</text>
  <text x="730" y="320" font-size="11.5" fill="#475569">埋了未来的坑</text>

  <rect x="26" y="348" width="844" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="448" y="380" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">合入 main</text>
</svg>
