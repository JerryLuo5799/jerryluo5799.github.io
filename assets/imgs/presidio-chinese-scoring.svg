<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <defs>
    <marker id="ca" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="32" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">识别中国身份证号的三级跳：分数是怎么一步步涨上去的</text>
  <text x="450" y="54" font-size="12.5" fill="#64748b" text-anchor="middle">待判断文本：「他的身份证是 11010519491231002X」</text>

  <!-- step 1 -->
  <rect x="25" y="80" width="270" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="106" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">① 正则初筛</text>
  <text x="45" y="132" font-size="12" fill="#475569">18 位、末位可能是 X</text>
  <rect x="45" y="144" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="57" y="164" font-size="11.5" fill="#1e40af" font-family="'Cascadia Code',Consolas,monospace">\d{17}[\dXx]</text>
  <text x="45" y="196" font-size="12" fill="#64748b">问题：银行流水号、订单号</text>
  <text x="45" y="215" font-size="12" fill="#64748b">也可能是 18 位纯数字</text>
  <rect x="160" y="238" width="135" height="30" rx="15" fill="#dbeafe"/>
  <text x="227" y="258" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">分数 0.10</text>

  <!-- step 2 -->
  <rect x="315" y="80" width="270" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="106" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">② 校验位验证</text>
  <text x="335" y="132" font-size="12" fill="#475569">按 GB 11643 算最后一位</text>
  <rect x="335" y="144" width="230" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="347" y="164" font-size="11.5" fill="#065f46" font-family="'Cascadia Code',Consolas,monospace">加权求和 % 11 → 查表</text>
  <text x="335" y="196" font-size="12" fill="#64748b">算出来是 X，和原文一致</text>
  <text x="335" y="215" font-size="12" fill="#64748b">→ 这串数字是真的</text>
  <rect x="450" y="238" width="135" height="30" rx="15" fill="#a7f3d0"/>
  <text x="517" y="258" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">分数 0.60</text>

  <!-- step 3 -->
  <rect x="605" y="80" width="270" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="106" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">③ 上下文加权</text>
  <text x="625" y="132" font-size="12" fill="#475569">看看附近有没有提示词</text>
  <rect x="625" y="144" width="230" height="30" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="637" y="164" font-size="11.5" fill="#5b21b6">context=["身份证","证件号"]</text>
  <text x="625" y="196" font-size="12" fill="#64748b">前面就有「身份证」二字</text>
  <text x="625" y="215" font-size="12" fill="#64748b">→ 基本可以确定了</text>
  <rect x="740" y="238" width="135" height="30" rx="15" fill="#ddd6fe"/>
  <text x="807" y="258" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">分数 0.85</text>

  <line x1="299" y1="155" x2="311" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#ca)"/>
  <line x1="589" y1="155" x2="601" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#ca)"/>

  <!-- threshold bar -->
  <text x="45" y="306" font-size="13" font-weight="700" fill="#334155">最终分数 vs 你设的阈值</text>
  <rect x="45" y="318" width="810" height="34" rx="17" fill="#f1f5f9"/>
  <rect x="45" y="318" width="689" height="34" rx="17" fill="#7c3aed"/>
  <text x="60" y="340" font-size="12.5" font-weight="700" fill="#ffffff">0.85</text>
  <line x1="450" y1="310" x2="450" y2="360" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="458" y="374" font-size="12" font-weight="700" fill="#b91c1c">score_threshold = 0.5</text>
  <text x="855" y="340" font-size="12" fill="#ffffff" text-anchor="end">1.0</text>

  <rect x="45" y="392" width="810" height="42" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="65" y="418" font-size="12.5" fill="#78350f">关键：光有正则只能给 0.1 分，会被阈值直接砍掉。<tspan font-weight="700">校验位和上下文词才是让它从「可能」变成「确定」的东西。</tspan></text>
</svg>
