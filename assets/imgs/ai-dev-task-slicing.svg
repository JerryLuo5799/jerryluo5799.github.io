<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">同一个需求，两种切法：错误代价差了一个数量级</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">需求：报销单支持发票附件上传，含大小校验、缩略图和审批页预览。</text>

  <rect x="30" y="76" width="840" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="46" y="92" width="120" height="26" rx="13" fill="#dc2626"/>
  <text x="106" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">一口气做完</text>
  <text x="182" y="110" font-size="12.5" fill="#991b1b">「帮我实现发票附件功能」</text>

  <rect x="46" y="132" width="700" height="52" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="66" y="154" font-size="12.5" font-weight="700" fill="#334155">一次提交 · 23 个文件 · +1180 −64</text>
  <text x="66" y="174" font-size="11.5" fill="#64748b">存储抽象、上传端点、大小校验、缩略图生成、前端组件、审批页改造，全在里面</text>
  <rect x="762" y="140" width="92" height="36" rx="8" fill="#dc2626"/>
  <text x="808" y="163" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">无法 review</text>

  <text x="46" y="208" font-size="11.5" fill="#991b1b">缩略图那块用错了库 → 但错误埋在 1180 行里 → 只能整段回滚，前面对的部分一起丢</text>

  <path d="M 450 226 L 450 250" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <rect x="30" y="258" width="840" height="152" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="46" y="274" width="120" height="26" rx="13" fill="#059669"/>
  <text x="106" y="292" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">切成五步</text>
  <text x="182" y="292" font-size="12.5" fill="#065f46">每一步的验收标准都能一句话说清</text>

  <g font-size="11.5">
    <rect x="46" y="312" width="152" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="60" y="332" font-size="12" font-weight="700" fill="#334155">① 存储抽象</text>
    <text x="60" y="350" fill="#64748b">IReceiptStore 接口</text>
    <text x="60" y="366" fill="#64748b">+ 本地文件实现</text>

    <rect x="210" y="312" width="152" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="224" y="332" font-size="12" font-weight="700" fill="#334155">② 上传端点</text>
    <text x="224" y="350" fill="#64748b">POST /expenses/</text>
    <text x="224" y="366" fill="#64748b">{id}/receipt</text>

    <rect x="374" y="312" width="152" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="388" y="332" font-size="12" font-weight="700" fill="#334155">③ 大小与类型校验</text>
    <text x="388" y="350" fill="#64748b">超 10MB 返回 413</text>
    <text x="388" y="366" fill="#64748b">只收 jpg/png/pdf</text>

    <rect x="538" y="312" width="152" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="552" y="332" font-size="12" font-weight="700" fill="#334155">④ 缩略图</text>
    <text x="552" y="350" fill="#64748b">上传后异步生成</text>
    <text x="552" y="366" fill="#64748b">失败不阻塞上传</text>

    <rect x="702" y="312" width="152" height="60" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="716" y="332" font-size="12" font-weight="700" fill="#334155">⑤ 审批页预览</text>
    <text x="716" y="350" fill="#64748b">点缩略图开大图</text>
    <text x="716" y="366" fill="#64748b">前端改动</text>
  </g>

  <text x="46" y="394" font-size="11.5" fill="#065f46">第 ④ 步用错了库 → 前三步已经合进 main → 只回滚 ④，损失一次任务的时间</text>
</svg>
