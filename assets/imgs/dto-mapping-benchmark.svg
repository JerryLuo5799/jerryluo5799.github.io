<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">单次映射耗时（对数刻度，越短越快）</text>
  <text x="450" y="56" font-size="12.5" fill="#64748b" text-anchor="middle">BenchmarkDotNet 0.15.4 · .NET 10.0.8 · Intel Core Ultra 7 155H · 柱旁为平均耗时与每次分配</text>

  <!-- 网格：每个数量级一条 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="250" y1="80" x2="250" y2="360"/>
    <line x1="364" y1="80" x2="364" y2="360"/>
    <line x1="478" y1="80" x2="478" y2="360"/>
    <line x1="592" y1="80" x2="592" y2="360"/>
    <line x1="706" y1="80" x2="706" y2="360"/>
    <line x1="820" y1="80" x2="820" y2="360"/>
  </g>
  <line x1="250" y1="80" x2="250" y2="360" stroke="#94a3b8" stroke-width="1"/>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="250" y="380">10 ns</text>
    <text x="364" y="380">100 ns</text>
    <text x="478" y="380">1 μs</text>
    <text x="592" y="380">10 μs</text>
    <text x="706" y="380">100 μs</text>
    <text x="820" y="380">1 ms</text>
  </g>

  <!-- 行标签 -->
  <g font-size="13" fill="#334155" text-anchor="end">
    <text x="236" y="109">手写赋值（基线）</text>
    <text x="236" y="155">源生成器</text>
    <text x="236" y="201">表达式树（缓存委托）</text>
    <text x="236" y="247">反射（缓存 PropertyInfo）</text>
    <text x="236" y="293">反射（每次 GetProperties）</text>
    <text x="236" y="339">表达式树（每次 Compile）</text>
  </g>

  <!-- 柱：宽度 = 114 × log10(耗时 / 10ns) -->
  <rect x="250" y="92" width="20.2" height="24" rx="4" fill="#94a3b8"/>
  <rect x="250" y="138" width="14.5" height="24" rx="4" fill="#2563eb"/>
  <rect x="250" y="184" width="19.7" height="24" rx="4" fill="#2563eb"/>
  <rect x="250" y="230" width="147.6" height="24" rx="4" fill="#2563eb"/>
  <rect x="250" y="276" width="197.9" height="24" rx="4" fill="#2563eb"/>
  <rect x="250" y="322" width="485.1" height="24" rx="4" fill="#2563eb"/>

  <!-- 数值标注 -->
  <g font-size="12" fill="#334155">
    <text x="280" y="109"><tspan font-weight="700">15.04 ns</tspan><tspan fill="#64748b">  · 120 B</tspan></text>
    <text x="275" y="155"><tspan font-weight="700">13.39 ns</tspan><tspan fill="#64748b">  · 120 B · 与基线同一份代码，差距在误差内</tspan></text>
    <text x="280" y="201"><tspan font-weight="700">14.89 ns</tspan><tspan fill="#64748b">  · 120 B · ≈ 基线</tspan></text>
    <text x="408" y="247"><tspan font-weight="700">197.13 ns</tspan><tspan fill="#64748b">  · 256 B · 13.3 倍</tspan></text>
    <text x="458" y="293"><tspan font-weight="700">544.72 ns</tspan><tspan fill="#64748b">  · 376 B · 36.6 倍</tspan></text>
    <text x="745" y="339"><tspan font-weight="700">180.0 μs</tspan><tspan fill="#64748b">  · 9,344 B</tspan></text>
  </g>
  <text x="745" y="314" font-size="11.5" fill="#b91c1c">约 12,000 倍</text>

  <text x="450" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">灰色为手写赋值基线；三条贴近 10 ns 的柱子差距不到 2 ns，属于同一量级</text>
</svg>
