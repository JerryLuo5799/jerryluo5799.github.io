<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">四选一：先问「我缺的到底是什么」，而不是「哪个技术更先进」</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">四者可以叠加使用，但每一个只解决一类缺口。用错了，症状是「配了一堆东西，还是不好用」。</text>

  <rect x="30" y="82" width="150" height="352" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="105" y="240" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">你缺的</text>
  <text x="105" y="264" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">是什么？</text>

  <path d="M 180 138 L 226 138" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#am)"/>
  <path d="M 180 220 L 226 220" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#am)"/>
  <path d="M 180 302 L 226 302" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#am)"/>
  <path d="M 180 384 L 226 384" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#am)"/>

  <g>
    <rect x="236" y="104" width="300" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="254" y="130" font-size="13" font-weight="700" fill="#334155">「同一段要求我打了三遍」</text>
    <text x="254" y="152" font-size="11.5" fill="#64748b">流程是固定的，只是懒得每次重述</text>
    <rect x="556" y="104" width="314" height="68" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="572" y="118" width="106" height="24" rx="12" fill="#64748b"/>
    <text x="625" y="135" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Prompt 文件</text>
    <text x="572" y="162" font-size="11.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">.github/prompts/*.prompt.md</text>
  </g>

  <g>
    <rect x="236" y="186" width="300" height="68" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="254" y="212" font-size="13" font-weight="700" fill="#334155">「这类活它总是手太快」</text>
    <text x="254" y="234" font-size="11.5" fill="#64748b">需要持续约束它的角色和可用工具</text>
    <rect x="556" y="186" width="314" height="68" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="572" y="200" width="106" height="24" rx="12" fill="#7c3aed"/>
    <text x="625" y="217" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Chat Mode</text>
    <text x="572" y="244" font-size="11.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">.github/chatmodes/*.chatmode.md</text>
  </g>

  <g>
    <rect x="236" y="268" width="300" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="254" y="294" font-size="13" font-weight="700" fill="#334155">「它够不着那个东西」</text>
    <text x="254" y="316" font-size="11.5" fill="#64748b">数据库、内部 API、浏览器、工单系统</text>
    <rect x="556" y="268" width="314" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="572" y="282" width="106" height="24" rx="12" fill="#2563eb"/>
    <text x="625" y="299" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">MCP 服务器</text>
    <text x="572" y="326" font-size="11.5" fill="#475569">给它一双新的手，而不是新的说明书</text>
  </g>

  <g>
    <rect x="236" y="350" width="300" height="68" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="254" y="376" font-size="13" font-weight="700" fill="#334155">「这套做法有七步，还带判断」</text>
    <text x="254" y="398" font-size="11.5" fill="#64748b">知识量大到不该常驻上下文</text>
    <rect x="556" y="350" width="314" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="572" y="364" width="106" height="24" rx="12" fill="#059669"/>
    <text x="625" y="381" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Skill</text>
    <text x="572" y="408" font-size="11.5" fill="#475569">按需加载的流程手册，用到才读</text>
  </g>

  <text x="30" y="456" font-size="11.5" fill="#94a3b8">一句话区分：Prompt 文件省你的打字，Chat Mode 管它的姿势，MCP 给它新能力，Skill 教它一套做法。</text>
</svg>
