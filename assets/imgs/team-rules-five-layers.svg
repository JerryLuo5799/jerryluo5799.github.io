<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">五大障碍与五根支柱：从最下面一层修起</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">每一层都以下面一层为前提。信任没立住，上面四层的努力都撑不久。</text>

  <text x="170" y="88" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">障碍</text>
  <text x="450" y="88" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">团队里的表现</text>
  <text x="740" y="88" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">支柱</text>

  <g font-size="12">
    <!-- layer 5 top -->
    <rect x="30" y="100" width="280" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="46" y="134" font-size="13" font-weight="700" fill="#b91c1c">⑤ 无视结果</text>
    <rect x="324" y="100" width="252" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="124" fill="#475569">"我的部分按时完成了"</text>
    <text x="338" y="144" fill="#64748b">功能有没有上线，不在考虑内</text>
    <rect x="590" y="100" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="606" y="134" font-size="13" font-weight="700" fill="#047857">关注共同结果</text>

    <!-- layer 4 -->
    <rect x="30" y="166" width="280" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="46" y="200" font-size="13" font-weight="700" fill="#b91c1c">④ 逃避责任</text>
    <rect x="324" y="166" width="252" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="190" fill="#475569">看到同事偏离约定，不吭声</text>
    <text x="338" y="210" fill="#64748b">提醒别人成了领导的专属工作</text>
    <rect x="590" y="166" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="606" y="200" font-size="13" font-weight="700" fill="#047857">相互负责</text>

    <!-- layer 3 -->
    <rect x="30" y="232" width="280" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="46" y="266" font-size="13" font-weight="700" fill="#b91c1c">③ 欠缺投入</text>
    <rect x="324" y="232" width="252" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="256" fill="#475569">会上定的事，两周后没人推</text>
    <text x="338" y="276" fill="#64748b">"当时我就觉得不行"</text>
    <rect x="590" y="232" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="606" y="266" font-size="13" font-weight="700" fill="#047857">对决定的投入</text>

    <!-- layer 2 -->
    <rect x="30" y="298" width="280" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="46" y="332" font-size="13" font-weight="700" fill="#b91c1c">② 惧怕冲突</text>
    <rect x="324" y="298" width="252" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="322" fill="#475569">会上一团和气，评审全是"没问题"</text>
    <text x="338" y="342" fill="#64748b">真实意见留在会后的私聊里</text>
    <rect x="590" y="298" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="606" y="332" font-size="13" font-weight="700" fill="#047857">良性冲突</text>

    <!-- layer 1 base -->
    <rect x="30" y="364" width="280" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="46" y="398" font-size="13" font-weight="700" fill="#b91c1c">① 缺乏信任</text>
    <rect x="324" y="364" width="252" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="338" y="388" fill="#475569">不敢说"我不会""我搞错了"</text>
    <text x="338" y="408" fill="#64748b">弱点和失误被藏起来</text>
    <rect x="590" y="364" width="280" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="606" y="398" font-size="13" font-weight="700" fill="#047857">信任与示弱</text>
  </g>

  <g font-size="11.5" fill="#64748b">
    <text x="296" y="134" text-anchor="end">结果</text>
    <text x="296" y="398" text-anchor="end" fill="#b91c1c">根源</text>
    <text x="856" y="398" text-anchor="end" fill="#047857">地基</text>
  </g>

  <line x1="318" y1="418" x2="318" y2="106" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl)"/>
  <line x1="582" y1="418" x2="582" y2="106" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl)"/>
  <text x="450" y="444" font-size="12" fill="#64748b" text-anchor="middle">箭头方向：下层导致上层（左），下层支撑上层（右）</text>
</svg>
