  <text x="735" y="119" font-size="12" fill="#1e40af" text-anchor="middle">编译项目</text>

  <text x="24" y="238" font-size="13" font-weight="700" fill="#334155">Preview 7</text>
  <text x="24" y="258" font-size="11.5" fill="#94a3b8">引擎留在内存里</text>
  <rect x="180" y="222" width="76" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="218" y="249" font-size="11.5" fill="#475569" text-anchor="middle">冷启动</text>
