  <rect x="524" y="222" width="118" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="583" y="249" font-size="12" fill="#1e40af" text-anchor="middle">编译项目</text>

  <rect x="180" y="276" width="462" height="26" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="411" y="294" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">MSBuild Server 工作进程常驻，跨命令复用</text>

  <line x1="794" y1="86" x2="794" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="642" y1="216" x2="642" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="642" y1="324" x2="794" y2="324" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="718" y="345" font-size="11.5" fill="#475569" text-anchor="middle">省下的两次引擎启动</text>

  <text x="24" y="378" font-size="11.5" fill="#64748b">退回旧行为：DOTNET_CLI_USE_MSBUILD_SERVER=false 或 MSBUILDUSESERVER=0，前者具有最终决定权，不会被响应文件或 /mt 重新打开</text>
