<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">三个月带教计划的节奏</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">师傅三个月里的固定投入约三小时，其余时间由徒弟自己做。</text>

  <!-- month bands -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <rect x="60" y="84" width="250" height="24" rx="4" fill="#f1f5f9"/>
    <text x="185" y="101">第 1 个月</text>
    <rect x="316" y="84" width="250" height="24" rx="4" fill="#f1f5f9"/>
    <text x="441" y="101">第 2 个月</text>
    <rect x="572" y="84" width="250" height="24" rx="4" fill="#f1f5f9"/>
    <text x="697" y="101">第 3 个月</text>
  </g>

  <line x1="50" y1="160" x2="850" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#mr)"/>

  <!-- weekly ticks -->
  <g fill="#2563eb">
    <circle cx="122" cy="160" r="5"/><circle cx="185" cy="160" r="5"/><circle cx="248" cy="160" r="5"/>
    <circle cx="378" cy="160" r="5"/><circle cx="441" cy="160" r="5"/><circle cx="504" cy="160" r="5"/>
    <circle cx="634" cy="160" r="5"/><circle cx="697" cy="160" r="5"/><circle cx="760" cy="160" r="5"/>
  </g>
  <!-- big milestones -->
  <circle cx="60" cy="160" r="11" fill="#7c3aed"/>
  <circle cx="313" cy="160" r="11" fill="#059669"/>
  <circle cx="569" cy="160" r="11" fill="#059669"/>
  <circle cx="822" cy="160" r="11" fill="#dc2626"/>

  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="60" y="138">开始</text>
    <text x="313" y="138">月度</text>
    <text x="569" y="138">月度</text>
    <text x="822" y="138">结束</text>
  </g>

  <!-- cards -->
  <g font-size="12">
    <rect x="30" y="196" width="200" height="132" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="46" y="210" width="126" height="24" rx="12" fill="#7c3aed"/>
    <text x="109" y="227" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">首次见面 · 30 分钟</text>
    <text x="46" y="258" fill="#475569">定一个主题</text>
    <text x="46" y="280" fill="#475569">定目标：三个月后</text>
    <text x="46" y="298" fill="#475569">要能独立做到什么</text>
    <text x="46" y="318" font-size="11" fill="#64748b">一次只学一样</text>

    <rect x="244" y="196" width="200" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="260" y="210" width="114" height="24" rx="12" fill="#2563eb"/>
    <text x="317" y="227" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">每周末 · 5 分钟</text>
    <text x="260" y="258" fill="#475569">这周做了什么</text>
    <text x="260" y="280" fill="#475569">卡在了哪里</text>
    <text x="260" y="302" fill="#475569">下周打算做什么</text>
    <text x="260" y="318" font-size="11" fill="#64748b">图中的蓝色小圆点</text>

    <rect x="458" y="196" width="200" height="132" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="474" y="210" width="126" height="24" rx="12" fill="#059669"/>
    <text x="537" y="227" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">每月一次 · 30 分钟</text>
    <text x="474" y="258" fill="#475569">回顾这个月的进展</text>
    <text x="474" y="280" fill="#475569">师傅给具体的建议</text>
    <text x="474" y="302" fill="#475569">定下个月的目标</text>

    <rect x="672" y="196" width="198" height="132" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="688" y="210" width="114" height="24" rx="12" fill="#dc2626"/>
    <text x="745" y="227" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">结束 · 30 分钟</text>
    <text x="688" y="258" fill="#475569">对照最初的目标总结</text>
    <text x="688" y="280" fill="#475569">定更长期的方向</text>
    <text x="688" y="302" fill="#475569">双方给这段经历打分</text>
    <text x="688" y="318" font-size="11" fill="#64748b">1 到 10 分</text>
  </g>

  <text x="30" y="364" font-size="12" fill="#475569">选题的办法：自己列出想学的 → 不亮出清单，问两三位同事"我最该补什么" → 两边对比后定一个。</text>
  <text x="30" y="384" font-size="12" fill="#475569">期间双方在状态里写明在学什么、跟谁学；结束后把新技能写进简介，并注明师傅是谁。</text>
</svg>
