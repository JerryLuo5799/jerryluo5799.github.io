<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="tm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">压力与专注：团队的四种状态</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">压力大不一定坏。压力大又不断被打断，才是倦怠的来源。</text>

  <line x1="150" y1="414" x2="830" y2="414" stroke="#94a3b8" stroke-width="2" marker-end="url(#tm)"/>
  <line x1="150" y1="414" x2="150" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#tm)"/>
  <text x="790" y="440" font-size="12" font-weight="700" fill="#64748b">专注</text>
  <text x="440" y="440" font-size="11.5" fill="#94a3b8">目标清晰、不被打断 →</text>
  <text x="60" y="100" font-size="12" font-weight="700" fill="#64748b">时间压力</text>
  <text x="52" y="250" font-size="11.5" fill="#94a3b8" transform="rotate(-90 52 250)" text-anchor="middle">期限越近越高 ↑</text>

  <g>
    <rect x="164" y="72" width="322" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="184" y="92" width="84" height="26" rx="13" fill="#dc2626"/>
    <text x="226" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">跑步机</text>
    <text x="184" y="142" font-size="12.5" fill="#475569">压力大 + 不断被打断</text>
    <text x="184" y="166" font-size="11.5" fill="#64748b">并行五件事、整天开会、消息不停，</text>
    <text x="184" y="186" font-size="11.5" fill="#64748b">一直在跑，哪里也没到</text>
    <text x="184" y="214" font-size="11.5" fill="#dc2626">没有创造力，倦怠从这里开始</text>
  </g>
  <g>
    <rect x="500" y="72" width="322" height="160" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="520" y="92" width="72" height="26" rx="13" fill="#7c3aed"/>
    <text x="556" y="110" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">使命</text>
    <text x="520" y="142" font-size="12.5" fill="#475569">压力大 + 高度专注</text>
    <text x="520" y="166" font-size="11.5" fill="#64748b">目标只有一个，所有人知道为什么急，</text>
    <text x="520" y="186" font-size="11.5" fill="#64748b">期间不被别的事打扰</text>
    <text x="520" y="214" font-size="11.5" fill="#7c3aed">有创造力，但不能长期维持</text>
  </g>
  <g>
    <rect x="164" y="240" width="322" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="184" y="260" width="96" height="26" rx="13" fill="#94a3b8"/>
    <text x="232" y="278" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">自动驾驶</text>
    <text x="184" y="310" font-size="12.5" fill="#475569">压力小 + 不投入</text>
    <text x="184" y="334" font-size="11.5" fill="#64748b">按部就班地处理例行工作，</text>
    <text x="184" y="354" font-size="11.5" fill="#64748b">没人提改进的想法</text>
    <text x="184" y="382" font-size="11.5" fill="#64748b">不累，也没有新东西</text>
  </g>
  <g>
    <rect x="500" y="240" width="322" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="520" y="260" width="72" height="26" rx="13" fill="#059669"/>
    <text x="556" y="278" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">探险</text>
    <text x="520" y="310" font-size="12.5" fill="#475569">压力小 + 有探索的空间</text>
    <text x="520" y="334" font-size="11.5" fill="#64748b">试验新做法、做技术预研、</text>
    <text x="520" y="354" font-size="11.5" fill="#64748b">一对一地讨论想法</text>
    <text x="520" y="382" font-size="11.5" fill="#059669">新想法大多出现在这里</text>
  </g>
</svg>
