<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="900" height="410" fill="#ffffff"/>
  <text x="450" y="34" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">runtime-async 的异步版本开始走完分层编译全程</text>
  <text x="450" y="56" font-size="12.5" fill="#64748b" text-anchor="middle">以前异步版本绕过分层，一直跑为编译速度优化的 tier0 代码，稳态吞吐吃亏</text>

  <rect x="70" y="90" width="180" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="128" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">方法首次调用</text>

  <line x1="252" y1="122" x2="286" y2="122" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="290" y="90" width="200" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="116" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">tier0 代码</text>
  <text x="390" y="138" font-size="11.5" fill="#1d4ed8" text-anchor="middle">出得快，优化少</text>

  <line x1="492" y1="122" x2="586" y2="122" stroke="#059669" stroke-width="1.8" marker-end="url(#arwg)"/>
  <text x="539" y="112" font-size="11" fill="#047857" text-anchor="middle">调用次数达阈值</text>

  <rect x="590" y="90" width="200" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="690" y="116" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">tier1 代码</text>
  <text x="690" y="138" font-size="11.5" fill="#047857" text-anchor="middle">优化充分</text>

  <line x1="539" y1="80" x2="539" y2="166" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="539" y="188" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Preview 6 及以前：异步版本停在这道线左边</text>
  <text x="539" y="208" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Preview 7：异步版本和同步方法一样往右走</text>

  <rect x="30" y="234" width="266" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="257" font-size="11.5" font-weight="700" fill="#475569">预热期最大分配速率</text>
  <text x="46" y="288" font-size="15" font-weight="700" fill="#b91c1c">110.6 MB/s</text>
  <text x="164" y="288" font-size="14" fill="#94a3b8">→</text>
  <text x="192" y="288" font-size="15" font-weight="700" fill="#047857">8.0 MB/s</text>
  <text x="46" y="313" font-size="11" fill="#64748b">TechEmpower platform-json</text>
  <text x="46" y="333" font-size="11" fill="#64748b">tail-await 优化下放到 tier0</text>

  <rect x="316" y="234" width="266" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="332" y="257" font-size="11.5" font-weight="700" fill="#475569">await 一亿次已完成的 Task</text>
  <text x="332" y="288" font-size="15" font-weight="700" fill="#b91c1c">191 ms</text>
  <text x="410" y="288" font-size="14" fill="#94a3b8">→</text>
  <text x="438" y="288" font-size="15" font-weight="700" fill="#047857">32 ms</text>
  <text x="332" y="313" font-size="11" fill="#64748b">TransparentAwait 可被内联</text>
  <text x="332" y="333" font-size="11" fill="#64748b">辅助调用折叠成一次状态位检查</text>

  <rect x="602" y="234" width="266" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="618" y="257" font-size="11.5" font-weight="700" fill="#475569">ValueTask 包装的代码体积</text>
  <text x="618" y="288" font-size="15" font-weight="700" fill="#b91c1c">115 字节</text>
  <text x="712" y="288" font-size="14" fill="#94a3b8">→</text>
  <text x="740" y="288" font-size="15" font-weight="700" fill="#047857">29 字节</text>
  <text x="618" y="313" font-size="11" fill="#64748b">完整栈帧加两次辅助调用</text>
  <text x="618" y="333" font-size="11" fill="#64748b">变成一次尾调用加状态检查</text>

  <text x="450" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">数据取自 .NET 11 Preview 7 运行时发布说明中的基准对照</text>
</svg>
