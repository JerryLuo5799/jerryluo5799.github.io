<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">分作用域的规则文件：只加载与手头文件相关的那几条</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">一份八百行的大文件，等于让模型每次都读一遍前端规范去改后端代码。拆开，按路径命中。</text>

  <rect x="30" y="80" width="360" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="106" font-size="12.5" font-weight="700" fill="#94a3b8">仓库结构</text>

  <text x="50" y="134" font-size="12.5" fill="#334155" font-family="'Cascadia Code',Consolas,monospace">ExpenseFlow/</text>
  <rect x="62" y="144" width="230" height="24" rx="5" fill="#ede9fe"/>
  <text x="72" y="161" font-size="12" fill="#5b21b6" font-family="'Cascadia Code',Consolas,monospace">├─ AGENTS.md</text>
  <text x="300" y="161" font-size="11" fill="#7c3aed">全仓通用</text>

  <text x="72" y="188" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">├─ .github/instructions/</text>
  <rect x="86" y="198" width="206" height="24" rx="5" fill="#dbeafe"/>
  <text x="96" y="215" font-size="12" fill="#1d4ed8" font-family="'Cascadia Code',Consolas,monospace">│  ├─ api.instructions.md</text>
  <rect x="86" y="228" width="206" height="24" rx="5" fill="#d1fae5"/>
  <text x="96" y="245" font-size="12" fill="#047857" font-family="'Cascadia Code',Consolas,monospace">│  ├─ tests.instructions.md</text>
  <rect x="86" y="258" width="206" height="24" rx="5" fill="#fee2e2"/>
  <text x="96" y="275" font-size="12" fill="#b91c1c" font-family="'Cascadia Code',Consolas,monospace">│  └─ web.instructions.md</text>

  <text x="72" y="302" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">├─ src/ExpenseFlow.Api/</text>
  <text x="92" y="324" font-size="12.5" fill="#334155" font-weight="700" font-family="'Cascadia Code',Consolas,monospace">│  └─ ApprovalPolicy.cs</text>
  <text x="72" y="346" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">├─ src/ExpenseFlow.Web/</text>
  <text x="72" y="368" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">└─ tests/ExpenseFlow.Tests/</text>
  <text x="50" y="396" font-size="11" fill="#94a3b8">规则跟着目录走，不跟着人的记忆走</text>

  <path d="M 300 324 C 400 324, 400 250, 470 250" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  <text x="352" y="300" font-size="11.5" fill="#7c3aed" font-weight="700">agent 打开这个文件</text>

  <rect x="480" y="80" width="390" height="330" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="106" font-size="12.5" font-weight="700" fill="#7c3aed">此刻实际生效的规则</text>

  <rect x="500" y="120" width="350" height="76" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="516" y="144" font-size="12.5" font-weight="700" fill="#334155">AGENTS.md</text>
  <text x="516" y="164" font-size="11.5" fill="#64748b">金额用 decimal、时间用 DateTimeOffset</text>
  <text x="516" y="182" font-size="11.5" fill="#64748b">改完必须 dotnet build + dotnet test</text>

  <rect x="500" y="206" width="350" height="76" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="516" y="230" font-size="12.5" font-weight="700" fill="#334155">api.instructions.md</text>
  <text x="516" y="250" font-size="11.5" fill="#64748b">applyTo: "src/ExpenseFlow.Api/**/*.cs"</text>
  <text x="516" y="268" font-size="11.5" fill="#64748b">阈值只在 ApprovalPolicy 里定义</text>

  <rect x="500" y="292" width="350" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="516" y="312" font-size="12.5" fill="#94a3b8">web.instructions.md　未命中</text>
  <text x="516" y="330" font-size="11.5" fill="#cbd5e1">前端规范这次一个字都不加载</text>

  <rect x="500" y="348" width="350" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="516" y="368" font-size="12.5" fill="#94a3b8">tests.instructions.md　未命中</text>
  <text x="516" y="386" font-size="11.5" fill="#cbd5e1">等它去改测试时才会进来</text>

  <text x="30" y="436" font-size="11.5" fill="#94a3b8">省下来的不只是 token —— 少读无关规则，等于少一次跑偏的机会。</text>
</svg>
