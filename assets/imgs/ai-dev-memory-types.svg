<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">AI 的四类记忆：只有第一类是模型自带的，其余三类得你亲手放进仓库</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">「每次都要重讲一遍」的抱怨，几乎都是二、三、四类缺失造成的。</text>

  <text x="150" y="88" font-size="12" font-weight="700" fill="#94a3b8">装的是什么</text>
  <text x="404" y="88" font-size="12" font-weight="700" fill="#94a3b8">落在哪里</text>
  <text x="646" y="88" font-size="12" font-weight="700" fill="#94a3b8">活多久</text>
  <line x1="30" y1="96" x2="870" y2="96" stroke="#e2e8f0" stroke-width="2"/>

  <g>
    <rect x="30" y="106" width="840" height="78" rx="8" fill="#f8fafc"/>
    <rect x="44" y="128" width="92" height="34" rx="7" fill="#94a3b8"/>
    <text x="90" y="150" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">工作记忆</text>
    <text x="150" y="134" font-size="12.5" fill="#475569">本次会话里说过的话、读过的文件</text>
    <text x="150" y="156" font-size="11.5" fill="#94a3b8">上下文窗口装得下的那部分</text>
    <text x="404" y="134" font-size="12.5" fill="#475569">模型的上下文窗口</text>
    <text x="404" y="156" font-size="11.5" fill="#94a3b8">你什么都不用做</text>
    <text x="646" y="134" font-size="12.5" fill="#475569">关掉会话就没了</text>
    <text x="646" y="156" font-size="11.5" fill="#94a3b8">而且越长越不可靠</text>
  </g>

  <g>
    <rect x="30" y="192" width="840" height="78" rx="8" fill="#f5f3ff"/>
    <rect x="44" y="214" width="92" height="34" rx="7" fill="#7c3aed"/>
    <text x="90" y="236" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">语义记忆</text>
    <text x="150" y="220" font-size="12.5" fill="#475569">项目的稳定事实与约定</text>
    <text x="150" y="242" font-size="11.5" fill="#94a3b8">金额用 decimal、阈值严格大于</text>
    <text x="404" y="220" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">AGENTS.md</text>
    <text x="404" y="242" font-size="11.5" fill="#94a3b8">.github/instructions/</text>
    <text x="646" y="220" font-size="12.5" fill="#475569">跟着仓库一直活</text>
    <text x="646" y="242" font-size="11.5" fill="#94a3b8">改动频率：月</text>
  </g>

  <g>
    <rect x="30" y="278" width="840" height="78" rx="8" fill="#eff6ff"/>
    <rect x="44" y="300" width="92" height="34" rx="7" fill="#2563eb"/>
    <text x="90" y="322" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">情景记忆</text>
    <text x="150" y="306" font-size="12.5" fill="#475569">做过什么、为什么这么选、踩过哪些坑</text>
    <text x="150" y="328" font-size="11.5" fill="#94a3b8">「上次为什么放弃了方案 B」</text>
    <text x="404" y="306" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">.agent/journal/</text>
    <text x="404" y="328" font-size="11.5" fill="#94a3b8" font-family="'Cascadia Code',Consolas,monospace">docs/DESIGN.md</text>
    <text x="646" y="306" font-size="12.5" fill="#475569">越积越厚</text>
    <text x="646" y="328" font-size="11.5" fill="#94a3b8">每次任务收尾时追加</text>
  </g>

  <g>
    <rect x="30" y="364" width="840" height="78" rx="8" fill="#ecfdf5"/>
    <rect x="44" y="386" width="92" height="34" rx="7" fill="#059669"/>
    <text x="90" y="408" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">程序记忆</text>
    <text x="150" y="392" font-size="12.5" fill="#475569">固化下来的做事流程</text>
    <text x="150" y="414" font-size="11.5" fill="#94a3b8">「加一个报销类别」要走哪七步</text>
    <text x="404" y="392" font-size="12.5" fill="#475569" font-family="'Cascadia Code',Consolas,monospace">.github/prompts/</text>
    <text x="404" y="414" font-size="11.5" fill="#94a3b8">Chat Mode / Skill</text>
    <text x="646" y="392" font-size="12.5" fill="#475569">写一次，全队复用</text>
    <text x="646" y="414" font-size="11.5" fill="#94a3b8">改动频率：季</text>
  </g>
</svg>
