<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="840" height="520" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="54" font-size="18" font-weight="700" fill="#334155">Harness（脚手架 / 挽具）</text>
  <text x="44" y="76" font-size="13" fill="#64748b">模型之外，你亲手搭建的这一整圈东西</text>

  <!-- connectors -->
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="440" y1="205" x2="440" y2="145"/>
    <line x1="368" y1="248" x2="300" y2="220"/>
    <line x1="368" y1="342" x2="300" y2="370"/>
    <line x1="440" y1="385" x2="440" y2="445"/>
    <line x1="512" y1="342" x2="580" y2="370"/>
    <line x1="512" y1="248" x2="580" y2="220"/>
  </g>

  <!-- core -->
  <circle cx="440" cy="295" r="90" fill="#1e293b"/>
  <text x="440" y="285" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">大模型</text>
  <text x="440" y="312" font-size="14" fill="#94a3b8" text-anchor="middle">Model =「发动机」</text>

  <!-- 1 tools -->
  <g><rect x="340" y="85" width="200" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="110" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">工具 Tools</text>
  <text x="440" y="131" font-size="12" fill="#475569" text-anchor="middle">让它能动手：读写文件、调 API</text></g>

  <!-- 2 context -->
  <g><rect x="124" y="175" width="200" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="224" y="200" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">上下文 Context</text>
  <text x="224" y="221" font-size="12" fill="#475569" text-anchor="middle">决定它「看得见」什么</text></g>

  <!-- 3 memory -->
  <g><rect x="124" y="355" width="200" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="224" y="380" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">记忆 Memory</text>
  <text x="224" y="401" font-size="12" fill="#475569" text-anchor="middle">跨会话记住结论与偏好</text></g>

  <!-- 4 feedback -->
  <g><rect x="340" y="445" width="200" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="440" y="470" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">反馈回路 Feedback</text>
  <text x="440" y="491" font-size="12" fill="#475569" text-anchor="middle">编译器 / 测试 / 日志的回声</text></g>

  <!-- 5 observability -->
  <g><rect x="556" y="355" width="200" height="60" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="656" y="380" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">可观测性 Observability</text>
  <text x="656" y="401" font-size="12" fill="#475569" text-anchor="middle">它到底做了什么，可回放</text></g>

  <!-- 6 guardrails -->
  <g><rect x="556" y="175" width="200" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="656" y="200" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">护栏 Guardrails</text>
  <text x="656" y="221" font-size="12" fill="#475569" text-anchor="middle">什么能做，什么必须先问人</text></g>
</svg>
