<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">设计债长这样：每次都"能用"，三个月后没有两个按钮是一样的</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">每一个都是某次 AI 生成的合理产物。问题不在单次质量，在没有收敛的约束。</text>

  <rect x="30" y="78" width="840" height="176" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="46" y="94" width="176" height="26" rx="13" fill="#dc2626"/>
  <text x="134" y="112" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">没有设计系统约束</text>
  <text x="238" y="112" font-size="12" fill="#991b1b">同一个「提交」按钮，九个页面九个样</text>

  <g>
    <rect x="50" y="136" width="88" height="34" rx="6" fill="#2563eb"/>
    <text x="94" y="158" font-size="12.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="50" y="186" font-size="10" fill="#94a3b8">#2563eb / r6</text>

    <rect x="154" y="134" width="96" height="38" rx="19" fill="#3b82f6"/>
    <text x="202" y="158" font-size="13.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="154" y="186" font-size="10" fill="#94a3b8">#3b82f6 / 全圆</text>

    <rect x="266" y="138" width="80" height="30" rx="3" fill="#1d4ed8"/>
    <text x="306" y="158" font-size="11.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="266" y="186" font-size="10" fill="#94a3b8">#1d4ed8 / r3</text>

    <rect x="362" y="134" width="92" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="408" y="158" font-size="12.5" fill="#2563eb" text-anchor="middle">提交</text>
    <text x="362" y="186" font-size="10" fill="#94a3b8">描边款</text>

    <rect x="470" y="136" width="88" height="34" rx="6" fill="#0ea5e9"/>
    <text x="514" y="158" font-size="12.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="470" y="186" font-size="10" fill="#94a3b8">#0ea5e9 天蓝</text>

    <rect x="574" y="132" width="104" height="42" rx="8" fill="#7c3aed"/>
    <text x="626" y="158" font-size="13.5" fill="#ffffff" text-anchor="middle">提 交</text>
    <text x="574" y="186" font-size="10" fill="#94a3b8">紫色 / 字间距</text>

    <rect x="694" y="138" width="76" height="30" rx="15" fill="#059669"/>
    <text x="732" y="158" font-size="11.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="694" y="186" font-size="10" fill="#94a3b8">绿色 / 全圆</text>

    <rect x="786" y="136" width="68" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="820" y="158" font-size="12" fill="#475569" text-anchor="middle">提交</text>
    <text x="786" y="186" font-size="10" fill="#94a3b8">幽灵款</text>
  </g>

  <text x="50" y="214" font-size="11.5" fill="#991b1b">改一次主色要动 9 个文件 · 新人不知道该抄哪个 · 视觉回归测试全是噪音</text>
  <text x="50" y="236" font-size="11.5" fill="#991b1b">而每一个当初都通过了 review —— 因为单看都没毛病</text>

  <rect x="30" y="272" width="840" height="146" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="46" y="288" width="176" height="26" rx="13" fill="#059669"/>
  <text x="134" y="306" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">token + 组件收口</text>
  <text x="238" y="306" font-size="12" fill="#065f46">只有三种，且都从同一份 token 取值</text>

  <g>
    <rect x="50" y="330" width="96" height="36" rx="6" fill="#2563eb"/>
    <text x="98" y="353" font-size="12.5" fill="#ffffff" text-anchor="middle">提交</text>
    <text x="50" y="382" font-size="10.5" fill="#64748b" font-family="'Cascadia Code',Consolas,monospace">&lt;Button variant="primary"&gt;</text>

    <rect x="290" y="330" width="96" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="338" y="353" font-size="12.5" fill="#2563eb" text-anchor="middle">取消</text>
    <text x="290" y="382" font-size="10.5" fill="#64748b" font-family="'Cascadia Code',Consolas,monospace">&lt;Button variant="secondary"&gt;</text>

    <rect x="546" y="330" width="96" height="36" rx="6" fill="#dc2626"/>
    <text x="594" y="353" font-size="12.5" fill="#ffffff" text-anchor="middle">驳回</text>
    <text x="546" y="382" font-size="10.5" fill="#64748b" font-family="'Cascadia Code',Consolas,monospace">&lt;Button variant="danger"&gt;</text>
  </g>

  <text x="50" y="406" font-size="11.5" fill="#065f46">改主色只动 tokens.css 一行 · AI 生成时没有第四种选择 · 检查脚本能验证</text>
</svg>
