<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#334155">用 worktree 并行：三个 agent 同时干活，但只有一份 .git</text>
  <text x="30" y="56" font-size="12.5" fill="#64748b">每个 worktree 是独立的工作目录和分支，互不干扰；对象库共享，磁盘和 clone 时间都省下来。</text>

  <rect x="30" y="82" width="200" height="230" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="110" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">ExpenseFlow/.git</text>
  <text x="130" y="132" font-size="11.5" fill="#64748b" text-anchor="middle">共享的对象库与引用</text>
  <rect x="52" y="150" width="156" height="30" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="130" y="170" font-size="11.5" fill="#475569" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace">objects/</text>
  <rect x="52" y="188" width="156" height="30" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="130" y="208" font-size="11.5" fill="#475569" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace">refs/heads/</text>
  <rect x="52" y="226" width="156" height="30" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="130" y="246" font-size="11.5" fill="#475569" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace">worktrees/</text>
  <text x="130" y="286" font-size="11" fill="#94a3b8" text-anchor="middle">一次 clone，反复使用</text>

  <path d="M 230 150 L 300 128" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M 230 197 L 300 205" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <path d="M 230 244 L 300 283" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>

  <g>
    <rect x="310" y="94" width="560" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="330" y="120" font-size="13" font-weight="700" fill="#334155" font-family="'Cascadia Code',Consolas,monospace">../ef-ocr</text>
    <text x="330" y="142" font-size="11.5" fill="#64748b">分支 feat/receipt-ocr　·　Agent A 正在接发票识别</text>
    <rect x="770" y="112" width="82" height="26" rx="13" fill="#2563eb"/>
    <text x="811" y="130" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">运行中</text>
  </g>
  <g>
    <rect x="310" y="172" width="560" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="330" y="198" font-size="13" font-weight="700" fill="#334155" font-family="'Cascadia Code',Consolas,monospace">../ef-fx</text>
    <text x="330" y="220" font-size="11.5" fill="#64748b">分支 feat/multi-currency　·　Agent B 正在加多币种</text>
    <rect x="770" y="190" width="82" height="26" rx="13" fill="#2563eb"/>
    <text x="811" y="208" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">运行中</text>
  </g>
  <g>
    <rect x="310" y="250" width="560" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="330" y="276" font-size="13" font-weight="700" fill="#334155" font-family="'Cascadia Code',Consolas,monospace">ExpenseFlow/</text>
    <text x="330" y="298" font-size="11.5" fill="#64748b">分支 main　·　你自己在这里 review 和合并</text>
    <rect x="770" y="268" width="82" height="26" rx="13" fill="#94a3b8"/>
    <text x="811" y="286" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">人类</text>
  </g>

  <text x="30" y="340" font-size="11.5" fill="#94a3b8">关键收益：agent 跑坏了只影响它自己那个目录，你手上的 main 一行没动。</text>
</svg>
